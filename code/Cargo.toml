[package]
name = "ipv6-token-webui"
version = "1.0.1"
edition = "2021"
authors = ["clearlove.ymg"]
description = "Web UI for managing IPv6 Token configuration on Linux NetworkManager"
license = "MIT"
repository = "https://github.com/MG5921MY/token64-eui-webui-public"
homepage = "https://github.com/MG5921MY/token64-eui-webui-public"
keywords = ["ipv6", "networkmanager", "webui", "token", "linux"]
categories = ["network-programming", "web-programming"]

[dependencies]
# Web 框架
actix-web = "4.4"
actix-files = "0.6"
actix-cors = "0.7"

# 异步运行时
tokio = { version = "1.35", features = ["full", "sync"] }
futures-util = "0.3"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 日志
env_logger = "0.11"
log = "0.4"

# 正则表达式（输入验证）
regex = "1.10"
lazy_static = "1.4"

# 权限检查
nix = { version = "0.27", features = ["user"] }

# 速率限制
actix-governor = "0.5"

# 配置文件
config = "0.14"
serde_yaml = "0.9"

# 静态资源嵌入
rust-embed = "8.2"
mime_guess = "2.0"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# CLI 参数解析
clap = { version = "4.4", features = ["derive"] }

# 认证相关
argon2 = "0.5"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
# 优化二进制大小
opt-level = "z"     # 优化大小
lto = true          # 链接时优化
codegen-units = 1   # 更好的优化
strip = true        # 移除调试符号
panic = "abort"     # 减小二进制大小
