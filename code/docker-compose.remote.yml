services:
  ipv6-token-webui:
    image: ghcr.io/mg5921my/token64-eui-webui-public:latest
    container_name: ipv6-token-webui
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - /var/run/dbus:/var/run/dbus:ro  # 挂载 D-Bus socket 以访问 NetworkManager
      - /run/NetworkManager:/run/NetworkManager:ro  # 挂载 NetworkManager 运行时目录
    environment:
      - LOG_LEVEL=info
    # 监听地址配置:
    # - 默认: 容器内监听 0.0.0.0（允许外部访问）
    # - 修改: 取消下面注释并修改监听地址
    # command: ["-H", "0.0.0.0", "-p", "5000"]  # 默认配置
    # command: ["-H", "127.0.0.1", "-p", "5000"]  # 仅本地访问（最安全）
    labels:
      - "description=IPv6 Token WebUI - 远程镜像版本"
      - "version=1.0.1"
